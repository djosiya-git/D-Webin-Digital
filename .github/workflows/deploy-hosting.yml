name: Deploy to NyanHosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare backend upload
        run: |
          mkdir -p deploy-nodeapp/tmp
          cp -r server deploy-nodeapp/server
          cp package.json package-lock.json deploy-nodeapp/
          date > deploy-nodeapp/tmp/restart.txt
          rm -f deploy-nodeapp/server/.env

      - name: Deploy frontend to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/nodeapp/**
            **/.well-known/**
            **/cgi-bin/**

      - name: Deploy backend to nodeapp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-nodeapp/
          server-dir: nodeapp/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
